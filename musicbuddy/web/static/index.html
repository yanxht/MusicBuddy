<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MusicBuddy">
  <title>MusicBuddy</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/"><img src="/static/icon.svg" alt=""><span>MusicBuddy</span></a>
      <nav class="nav-links">
        <a href="#/kid/keyu" data-nav="kid-keyu">Keyu</a>
        <a href="#/kid/ruyu" data-nav="kid-ruyu">Ruyu</a>
        <a href="#/upload" data-nav="upload">Upload</a>
      </nav>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <button id="ask-fab" class="ask-fab" hidden aria-label="Ask MusicBuddy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z"/></svg>
    <span>Ask</span>
  </button>

  <section id="chat" class="sheet" hidden aria-label="Chat">
    <div class="sheet-card">
      <div class="sheet-head">
        <div>
          <div class="sheet-title">Ask MusicBuddy</div>
          <div class="sheet-sub" id="chat-scope"></div>
        </div>
        <button class="icon-btn" id="chat-close" aria-label="Close">✕</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-suggest" id="chat-suggest"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Ask about the lesson…" autocomplete="off"></textarea>
        <button class="send" type="submit" aria-label="Send">↑</button>
      </form>
    </div>
  </section>

  <div id="player" class="player" hidden>
    <div class="player-main">
      <button class="pbtn" id="p-back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle">10</text></svg></button>
      <button class="pbtn main" id="p-toggle" aria-label="Play or pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button class="pbtn" id="p-fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle">10</text></svg></button>
      <div class="player-info">
        <div class="player-label" id="p-label"></div>
        <div class="player-bar" id="p-bar"><div class="player-fill" id="p-fill"></div></div>
        <div class="player-time"><span id="p-cur">0:00</span><span id="p-dur"></span></div>
      </div>
      <button class="chip-btn" id="p-speed" aria-label="Playback speed">1×</button>
      <button class="chip-btn" id="p-more" title="Keep listening past the end of the clip">Keep playing</button>
      <button class="icon-btn" id="p-close" aria-label="Close player">✕</button>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>

  <div id="lightbox" class="lightbox" hidden>
    <button class="icon-btn" id="lb-close" aria-label="Close">✕</button>
    <img id="lb-img" alt="">
    <div class="lb-bar"><span id="lb-cap"></span><a id="lb-open" target="_blank" rel="noopener">Open full size</a></div>
  </div>

  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="/static/icon.svg" alt="" class="login-icon">
      <h1>MusicBuddy</h1>
      <p>Lesson notes for Keyu &amp; Ruyu</p>
      <input id="login-pass" type="password" placeholder="Family passcode" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>

  <script src="/static/app.js?v=5"></script>
</body>
</html>
